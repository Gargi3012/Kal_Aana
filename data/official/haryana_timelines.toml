# Statutory service timelines under the Haryana Right to Service Act, 2014.
# Source: Haryana Right to Service Commission (haryanartsc.gov.in).
#
# days: the time the designated officer has to dispose of an application, in working days
# unless `unit` says otherwise.
# If it isn't met, the citizen can file a first appeal with the First Grievance Redressal
# Authority, then a second appeal with the Second Grievance Redressal Authority / HRTSC.

[meta]
source_url = "https://haryanartsc.gov.in"
source_name = "Haryana Right to Service Commission: Notified Timelines"
portal_url = "https://haryanartsc.gov.in"
fetched = 2026-10-08
act = "Haryana Right to Service Act, 2014"

[appeals.rto]
designated_officer = "Sub-Divisional Officer (Civil) / Secretary, Regional Transport Authority (RTA)"
first_appeal = "Deputy Commissioner / First Grievance Redressal Authority"
first_appeal_days = 30
second_appeal = "Haryana Right to Service Commission"
second_appeal_days = 30

[appeals.subregistrar]
designated_officer = "Sub-Registrar / Joint Sub-Registrar"
first_appeal = "District Registrar / Deputy Commissioner"
first_appeal_days = 30
second_appeal = "Haryana Right to Service Commission"
second_appeal_days = 30

